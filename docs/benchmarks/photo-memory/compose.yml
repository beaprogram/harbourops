# Throwaway measurement stack (see README.md). Its own Compose project, database, volume, and image tag, so it never
# touches the "harbourops" project's containers, volumes, or images. Nothing here is a deployment configuration.
name: hm-${HM_ARCH:-amd64}
services:
  pg:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: harbourops
      POSTGRES_USER: harbourops
      # Throwaway database with no published port: this password exists only inside the measurement network.
      POSTGRES_PASSWORD: measure-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbourops -d harbourops"]
      interval: 3s
      timeout: 3s
      retries: 30
  app:
    image: harbourops-measure:${HM_ARCH:-amd64}
    platform: linux/${HM_ARCH:-amd64}
    pull_policy: never
    env_file:
      - path: ${HM_ENVFILE:-env/default.env}
        required: false
    build:
      context: ../../..
    depends_on:
      pg:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Demo
      ConnectionStrings__Default: "Host=pg;Port=5432;Database=harbourops;Username=harbourops;Password=measure-only-password;GSS Encryption Mode=Disable"
      DemoData__Password: "HarbourDemo!2026"
      Security__CookieSecurePolicy: SameAsRequest
      Security__LoginPermitLimitPerMinute: "100"
      Attachments__Storage__LocalPath: /var/lib/harbourops/attachments
      # Only for running the amd64 image under QEMU user-mode emulation (W^X double mapping is not QEMU-safe).
      DOTNET_EnableWriteXorExecute: ${HM_WXE:-1}
      Attachments__MaxConcurrentProcessing: ${HM_PROC:-2}
      Attachments__MaxQueuedUploads: ${HM_QUEUE:-4}
    volumes:
      - photos:/var/lib/harbourops/attachments
    ports:
      - "127.0.0.1:${HM_PORT:-8099}:8080"
    cpus: ${HM_CPUS:-1}
    mem_limit: ${HM_MEM:-1750m}
volumes:
  photos:
