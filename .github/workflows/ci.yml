name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The manual deploy workflow reruns every check on the exact commit it deploys.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the *caller's* name when the deploy workflow reuses this file, so a push to main never
  # cancels the checks of a deployment that is running (and vice versa).
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  backend:
    name: Backend on ${{ matrix.postgres }} (build, migrations check, xUnit + PostgreSQL)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 18 matches docker-compose; 17 is the major version Supabase hosts the free public demo on.
        postgres: ["postgres:18.6-alpine", "postgres:17.11-alpine"]
    env:
      HARBOUROPS_TEST_POSTGRES_IMAGE: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore backend/HarbourOps.slnx --locked-mode

      - name: Build
        run: dotnet build backend/HarbourOps.slnx --no-restore -c Release

      - name: Fail if the EF model changed without a migration
        env:
          # Design-time only; no database connection is opened.
          ConnectionStrings__Default: Host=localhost;Database=design_time_only
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project backend/HarbourOps.Api --no-build --configuration Release

      # Includes the Azure Blob adapter against the Azurite emulator and the Supabase adapter against Supabase's
      # open-source Storage API server (both emulator verification, not the hosted services), and SkiaSharp image
      # processing natively on this linux-x64 runner.
      - name: Test (unit + Testcontainers PostgreSQL + Azurite + Supabase Storage API)
        run: dotnet test --solution backend/HarbourOps.slnx --no-build -c Release

  infrastructure:
    name: Infrastructure (Bicep build and lint; no Azure sign-in)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Compile and lint infra/main.bicep
        run: |
          az bicep install --version v0.48.1
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep

  frontend:
    name: Frontend (lint, types, Vitest, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end, accessibility, and x64 image processing (Docker Compose + Playwright + axe)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Create a throwaway .env for CI
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env

      - name: Build the container image and start the stack
        run: |
          docker compose up -d --build
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8088/health/ready && exit 0
            sleep 2
          done
          docker compose logs app
          exit 1

      # The photo tests below then exercise SkiaSharp inside the real linux/amd64 runtime image.
      - name: Confirm the app runs as linux/amd64
        run: |
          echo "runner: $(uname -m)"
          docker image inspect harbourops-app --format '{{.Os}}/{{.Architecture}}' | tee platform.txt
          grep -qx 'linux/amd64' platform.txt

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        run: npx playwright test

      # A failure report is downloadable from this public repository. Its viewer is Playwright code (Apache-2.0)
      # and its traces can contain the axe-core engine (MPL-2.0), injected without its licence header, so the
      # report carries both licences and axe-core's source location (THIRD-PARTY-NOTICES.md).
      - name: Add licence notices to the Playwright report
        if: failure()
        working-directory: e2e
        run: |
          [ -d node_modules/axe-core ] || exit 0
          out=playwright-report/third-party-licenses
          mkdir -p "$out"
          cp node_modules/axe-core/LICENSE "$out/axe-core-LICENSE.txt"
          cp node_modules/axe-core/LICENSE-3RD-PARTY.txt "$out/axe-core-LICENSE-3RD-PARTY.txt"
          for f in LICENSE NOTICE ThirdPartyNotices.txt; do cp "node_modules/playwright-core/$f" "$out/playwright-core-$f"; done
          version=$(node -p "require('./node_modules/axe-core/package.json').version")
          {
            echo "Traces in this report can contain axe-core $version (Copyright Deque Systems, Inc.), injected unmodified"
            echo "into the browser under test. axe-core is licensed under the Mozilla Public License 2.0"
            echo "(axe-core-LICENSE.txt). Its source code: https://github.com/dequelabs/axe-core/tree/v$version"
            echo
            echo "The report viewer is Playwright (Apache-2.0, Copyright Microsoft Corporation):"
            echo "playwright-core-LICENSE, playwright-core-NOTICE, playwright-core-ThirdPartyNotices.txt."
          } > "$out/README.txt"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: App logs
        if: failure()
        run: docker compose logs app

      - name: Stop the stack
        if: always()
        run: docker compose down -v
